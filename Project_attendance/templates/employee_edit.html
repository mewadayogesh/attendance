{% extends 'base.html' %}
{% block title %}Edit Employee{% endblock %}
{% set active_page = 'search' %}
{% block content %}
<div class="form-panel">
    <h2>Edit Employee Record</h2>
    <form method="POST" action="{{ url_for('edit_employee', employee_id=employee['id']) }}">
        <div class="input-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ employee['name'] }}" required>
        </div>

        <div class="input-group">
            <label>Employee ID</label>
            <input type="text" name="employee_id" value="{{ employee['employee_id'] }}" required>
        </div>

        <div class="input-group">
            <label>Designation</label>
            <input type="text" name="designation" value="{{ employee['designation'] or '' }}">
        </div>

        <div class="input-group">
            <label>DOB</label>
            <input type="date" name="dob" value="{{ employee['dob'] or '' }}">
        </div>

        <div class="input-group">
            <label>Date of Joining</label>
            <input type="date" name="date_of_joining" value="{{ employee['date_of_joining'] or '' }}">
        </div>

        <div class="button-group">
            <!--<button type="submit" class="btn-save">Save Changes</button>-->
            <button type="submit" class="btn-save">Update Record</button>
            <a href="{{ back_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
